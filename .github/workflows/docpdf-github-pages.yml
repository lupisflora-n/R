name: Publish docPDF to GitHub Pages
# Initial activation: repository public and Pages enabled by the owner.

on:
  push:
    branches: [codex/docpdf-line]
    paths:
      - '.github/workflows/docpdf-github-pages.yml'
      - 'src/**'
      - 'public/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: docpdf-github-pages
  cancel-in-progress: false

jobs:
  build:
    # Public repositories use the free standard GitHub-hosted runner allowance.
    if: github.ref == 'refs/heads/codex/docpdf-line' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.metadata.outputs.build }}
      files: ${{ steps.metadata.outputs.files }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Verify public package
        run: |
          npm run lint
          npm test
          npm run build
          node scripts/check-line-package.mjs
          npm run package:preview
          node scripts/check-github-pages.mjs
      - name: Record verified build
        id: metadata
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const {build, files} = JSON.parse(readFileSync('dist/build.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `build=${build}\nfiles=${files}\n`);
          JS
      - name: Upload static app only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Verify the public app received this build
        env:
          EXPECTED_BUILD: ${{ needs.build.outputs.build }}
          EXPECTED_FILES: ${{ needs.build.outputs.files }}
        run: node scripts/verify-line-publication.mjs https://lupisflora-n.github.io/R/ "$EXPECTED_BUILD" "$EXPECTED_FILES"
