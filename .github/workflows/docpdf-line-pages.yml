name: Publish docPDF LINE

on:
  push:
    branches: [codex/docpdf-line]
    paths:
      - '.github/workflows/docpdf-line-pages.yml'
      - 'src/**'
      - 'public/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: docpdf-line-pages-production
  cancel-in-progress: false

jobs:
  publish:
    # Activate only after credentials and the existing free Actions allowance are checked.
    if: github.ref == 'refs/heads/codex/docpdf-line' && vars.DOCPDF_AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check publication credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Actions secrets. Do not paste credentials into chat.'
            exit 1
          fi

      - name: Check out the isolated LINE branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'

      - name: Verify and build public assets
        run: |
          npm run lint
          npm test
          npm run build
          node scripts/check-line-package.mjs
          npm run package:preview

      - name: Update the existing LINE preview site
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          packageManager: npm
          # Cloudflare's production branch is main; the GitHub source stays codex/docpdf-line.
          command: pages deploy dist --project-name=docpdf-line-test --branch=main

      - name: Verify the fixed public URL
        run: |
          node scripts/verify-line-publication.mjs

